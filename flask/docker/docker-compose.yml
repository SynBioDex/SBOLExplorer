version: "3"
services:
  sbolexplorer:
    image: myersresearchgroup/sbolexplorer:snapshot
    ports:
      - "13162:13162"
    depends_on:
      - elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.3
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"

